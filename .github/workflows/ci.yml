name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels the run for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Lint and test the functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The database emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@13.35.1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.35.1

      - run: npm ci

      - name: Prettier and ESLint
        run: npm run lint

      # Engine and adapter tests, then the API tests against the emulators
      - name: Tests
        run: npm test
